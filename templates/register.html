{% extends 'base.html' %}
{% block content %}

<style>
    .auth-page {
        min-height: calc(100vh - 80px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: radial-gradient(circle at center, #151B2B 0%, #0B0F19 70%);
    }
    .auth-card {
        background: #151B2B;
        border: 1px solid rgba(63, 169, 245, 0.2);
        border-radius: 20px;
        padding: 50px 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 0 40px rgba(63, 169, 245, 0.1);
    }
    .auth-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        color: var(--off-white);
        margin-bottom: 10px;
        text-align: center;
    }
    .auth-subtitle {
        color: #8B92A8;
        font-size: 0.95rem;
        text-align: center;
        margin-bottom: 35px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
        display: block;
        color: #B8B3D1;
        font-size: 0.9rem;
        margin-bottom: 8px;
    }
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid rgba(63, 169, 245, 0.2);
        background: #0B0F19;
        color: var(--off-white);
        font-family: 'Poppins', sans-serif;
        font-size: 1rem;
        transition: 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: var(--amber-gold);
    }
    .auth-btn {
        width: 100%;
        padding: 15px;
        border-radius: 10px;
        background: var(--amber-gold);
        color: var(--near-black);
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
    }
    .auth-btn:hover {
        background: #FFCB5D;
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(245, 185, 66, 0.5);
    }
    .auth-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 0.9rem;
        color: #8B92A8;
    }
    .auth-footer a {
        color: var(--amber-gold);
        text-decoration: none;
        font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
</style>

<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Join CodeStreak</h1>
        <p class="auth-subtitle">Start your coding streak today.</p>

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="security_question">Security Question (for password reset)</label>
                <select id="security_question" name="security_question" required>
                    <option value="">-- Choose a question --</option>
                    <option value="What is your pet's name?">What is your pet's name?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first school?">What was the name of your first school?</option>
                    <option value="What is your favorite programming language?">What is your favorite programming language?</option>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="security_answer">Your Answer</label>
                <input type="text" id="security_answer" name="security_answer" required>
            </div>
            <button type="submit" class="auth-btn">Create Account →</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </div>
    </div>
</div>

{% endblock %}
